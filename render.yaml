services:
  - type: web
    name: agency-dashboard-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt && python load_csv.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ALLOWED_ORIGINS
        value: https://agency-dashboard.onrender.com
    plan: free

  - type: web
    name: agency-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agency-dashboard-api.onrender.com
